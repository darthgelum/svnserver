# Overlay for an EXISTING repository copy. Use together with compose.auto.yaml.
version: "3.2"
services:
  mirror:
    volumes:
      - type: bind
        source: ${EXISTING_REPOS:?Set EXISTING_REPOS to the directory containing repository folders}
        target: /data/repositories
  sync:
    environment:
      REQUIRE_SEED_ADOPTION: "1"
    volumes:
      - type: bind
        source: ${EXISTING_REPOS:?Set EXISTING_REPOS to the directory containing repository folders}
        target: /data/repositories
